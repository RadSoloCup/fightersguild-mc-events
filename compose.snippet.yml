# Deploy as its own tiny Compose project:
# /boot/config/plugins/compose.manager/projects/mc-events/

services:
  mc-events:
    build: https://github.com/RadSoloCup/fightersguild-mc-events.git#main
    container_name: fluxer-mc-events
    restart: unless-stopped
    env_file:
      - ./mc-events.env       # copy of .env.example, filled in
    volumes:
      - mc-events-data:/data  # named volume, NOT a bind mount onto the
                              # Unraid boot flash (FAT32, no unix perms)

volumes:
  mc-events-data:
